openapi: 3.0.3
info:
  title: 社区老年助餐 API
  version: 1.0.0
  description: 四角色完整业务接口。Bearer 授权、网点/绑定资源隔离。请求字段与状态规则详见项目 docs/api/v1.md；模拟支付只在 dev/test 可用。
servers:
- url: /api/v1
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
                  writeOnly: true
      responses:
        '200':
          description: 成功，返回随机令牌、UTC 过期时间和本人信息
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        token:
                          type: string
                        expiresAt:
                          type: string
                          format: date-time
                        user:
                          $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 唯一性冲突或仍有关联数据
        '422':
          description: 业务规则或状态不允许
      description: 权限、字段及业务约束参见 docs/api/v1.md。
      operationId: post_auth_login
  /auth/me:
    get:
      summary: 本人信息及最新授权
      responses:
        '200':
          description: 本人信息
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 唯一性冲突或仍有关联数据
        '422':
          description: 业务规则或状态不允许
      description: 权限、字段及业务约束参见 docs/api/v1.md。
      operationId: get_auth_me
  /auth/logout:
    post:
      summary: 撤销当前令牌
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 唯一性冲突或仍有关联数据
        '422':
          description: 业务规则或状态不允许
      description: 权限、字段及业务约束参见 docs/api/v1.md。
      operationId: post_auth_logout
  /auth/profile:
    put:
      summary: 修改本人姓名和联系电话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - realName
              properties:
                realName:
                  type: string
                  minLength: 1
                  maxLength: 80
                phone:
                  type: string
                  nullable: true
                  description: null 时保留原号码
                  pattern: ^\+?[0-9 -]{6,30}$
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 唯一性冲突或仍有关联数据
        '422':
          description: 业务规则或状态不允许
      description: 权限、字段及业务约束参见 docs/api/v1.md。
      operationId: put_auth_profile
  /auth/password:
    put:
      summary: 修改密码并撤销全部会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - oldPassword
              - newPassword
              properties:
                oldPassword:
                  type: string
                  minLength: 1
                  maxLength: 72
                  writeOnly: true
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 72
                  writeOnly: true
                  description: 通常至少 12 字符且 UTF-8 至多 72 字节；dev 且非 prod 的四个本地演示账号允许恢复为自己的账号名
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 原密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
