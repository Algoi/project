components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Envelope:
      type: object
      required:
      - code
      - message
      - data
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        realName:
          type: string
          nullable: true
        phoneMasked:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - CANTEEN
            - FAMILY
            - COMMUNITY
        sites:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
              address:
                type: string
                nullable: true
              phone:
                type: string
                nullable: true
              businessStatus:
                type: string
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Invalid:
      description: 参数错误 VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthorized:
      description: 未登录或会话失效 UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Forbidden:
      description: 无权限 FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
