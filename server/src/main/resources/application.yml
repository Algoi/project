server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: elder-meal
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/elder_meal?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    clean-disabled: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT
  global-config:
    banner: false
app:
  encryption-key: ${APP_ENCRYPTION_KEY}
  upload-path: ${APP_UPLOAD_PATH:./uploads/private}
  timezone: Asia/Shanghai
  algorithms:
    forecast: ${APP_FORECAST_ALGORITHM:weekday_average_v1}
    recommendation: ${APP_RECOMMENDATION_ALGORITHM:weighted_score_v1}
  auth:
    token-lifetime: PT8H
    password-strength: 12
